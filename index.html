<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市区町村クイズ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --paper:#f3ead4; --paper2:#ece0c2; --ink:#2c2620; --ink-soft:#6b6253;
    --land:#cdd9cf; --land-stroke:#8a9a8d; --sea:#d9e3df;
    --vermilion:#c0432d; --indigo:#2f4a63;
    --ok:#2f6e4f; --ng:#b23b2e; --hint:#d9a441;
    --line:#bcae8e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Zen Kaku Gothic New",sans-serif; color:var(--ink);
    background:radial-gradient(120% 120% at 0% 0%, #f7efda 0%, var(--paper) 45%, var(--paper2) 100%);
    min-height:100vh; padding:22px 16px 40px;
  }
  .wrap{max-width:1000px;margin:0 auto}
  header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
  .title{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:26px;letter-spacing:.06em}
  .subtitle{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
  @media(max-width:780px){.grid{grid-template-columns:1fr}}

  .panel{background:rgba(255,252,243,.74);border:1px solid var(--line);border-radius:4px;
    padding:18px 16px;box-shadow:0 1px 0 #fff inset, 2px 3px 0 rgba(120,105,70,.18)}
  .askrow{display:flex;justify-content:space-between;align-items:baseline}
  .ask{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  .mode{font-size:11px;color:var(--vermilion);font-weight:700;letter-spacing:.06em}
  .muni{font-family:"Shippori Mincho B1",serif;font-weight:800;
    font-size:clamp(34px,7vw,52px);line-height:1.05;letter-spacing:.02em;margin-top:2px}
  .kana{font-size:13px;color:var(--ink-soft);letter-spacing:.18em;margin-top:6px;min-height:18px}
  .prompt{margin-top:10px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .prompt b{color:var(--vermilion)}
  .progress{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:15px;
    border:1px solid var(--line);border-radius:20px;padding:2px 12px;background:#fff}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--hint);
    border-radius:3px;padding:2px 7px;letter-spacing:.04em}

  .feedback{margin-top:14px;min-height:70px;font-size:14px}
  .res{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px}
  .res.ok{color:var(--ok)} .res.ng{color:var(--ng)} .res.hintdone{color:var(--hint)}
  .reads{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .rline{display:flex;gap:10px;align-items:baseline;font-size:13.5px;padding:1px 0}
  .rp{font-weight:700;min-width:78px;color:var(--indigo)}
  .rk{color:var(--ink-soft);letter-spacing:.12em}

  .stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .stat{flex:1;min-width:64px;text-align:center;border:1px solid var(--line);border-radius:3px;
    padding:8px 4px;background:rgba(255,255,255,.45)}
  .stat .n{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:21px}
  .stat .l{font-size:11px;color:var(--ink-soft);letter-spacing:.06em}

  .controls{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
  select,button{font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--ink);
    background:var(--paper);border-radius:3px;padding:8px 11px;cursor:pointer}
  button.primary{background:var(--vermilion);color:#fff;border-color:var(--vermilion);font-weight:700}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:default}
  label.rangelbl{font-size:12px;color:var(--ink-soft)}

  .mapwrap{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:4px;
    box-shadow:2px 3px 0 rgba(120,105,70,.18)}
  svg{display:block;width:100%;height:auto}
  path.pref{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6;cursor:pointer;transition:fill .12s}
  path.pref:hover{fill:#bcd0c0}
  path.pref.cand{fill:#f0d79a}
  path.pref.found{fill:var(--ok);stroke:#1e4a33}
  path.pref.ng{fill:var(--ng);stroke:#7d271d}
  .insetbox{fill:none;stroke:var(--land-stroke);stroke-width:.8;stroke-dasharray:3 2}
  .inset-label{font-size:9px;fill:var(--ink-soft);font-family:"Zen Kaku Gothic New"}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;
    padding:3px 8px;border-radius:3px;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .1s}
  .footnote{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.7}
  kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:#fff}
</style>

<div class="wrap">
  <header class="top">
    <div class="title">市区町村 → 都道府県</div>
    <div class="subtitle">地図をクリックして答える / 出典: 総務省 全国地方公共団体コード（R6.1.1）</div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="askrow">
        <div class="ask">この市区町村があるのは？</div>
        <div class="mode" id="modeLabel"></div>
      </div>
      <div class="muni" id="muni">—</div>
      <div class="kana" id="kana"></div>
      <div class="prompt">
        <span>地図上の<b>都道府県</b>をクリック</span>
        <span class="progress" id="progress" style="display:none"></span>
        <span class="badge" id="dupBadge" style="display:none">読み違い注意</span>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div class="stat"><div class="n" id="sScore">0</div><div class="l">正解</div></div>
        <div class="stat"><div class="n" id="sTotal">0</div><div class="l">出題</div></div>
        <div class="stat"><div class="n" id="sAcc">—</div><div class="l">正答率</div></div>
        <div class="stat"><div class="n" id="sStreak">0</div><div class="l">連続 (最高<span id="sBest">0</span>)</div></div>
      </div>

      <div class="controls">
        <label class="rangelbl">地域</label>
        <select id="region">
          <option value="all">全国</option>
          <option value="北海道">北海道</option>
          <option value="東北">東北</option>
          <option value="関東">関東</option>
          <option value="中部">中部</option>
          <option value="近畿">近畿</option>
          <option value="中国四国">中国・四国</option>
          <option value="九州沖縄">九州・沖縄</option>
        </select>
        
        <label class="rangelbl">範囲</label>
        <select id="range">
          <option value="all">すべて</option>
          <option value="shi">市のみ</option>
          <option value="machimura">町村のみ</option>
        </select>
        
        <button id="hint">ヒント (h)</button>
        <button class="ghost" id="giveup">答えを見る</button>
      </div>
      <div class="controls">
        <button class="primary" id="next" disabled>次の問題 →</button>
        <button class="ghost" id="review" disabled>復習 (0)</button>
        <button class="ghost" id="exitReview" style="display:none">通常出題へ</button>
      </div>
      <div class="footnote">
        同名（漢字）の市区町村は<b>該当する全ての県</b>を当てると正解。1つでも違う県を押すと不正解です。
        読みが分かれる名前は回答後に各県の読みを表示します。沖縄は左上の枠内。
        <kbd>Enter</kbd>次へ / <kbd>h</kbd>ヒント
      </div>
    </div>

    <div class="mapwrap" id="mapwrap">
      <div class="tip" id="tip"></div>
    </div>
  </div>
</div>

// 逆引き用の辞書を作成
const CITY_TO_BUREAU = {};
for (const [bureau, cities] of Object.entries(HOKKAIDO_BUREAUS)) {
  cities.forEach(city => CITY_TO_BUREAU[city] = bureau);
}

// データ内の「北海道」を自動で振興局名にすり替える
let tomariCount = 0;
DATA.munis.forEach(m => {
  if (m.pref === '北海道') {
    // 💡超マニアックな特例：「泊村」は後志管内と北方領土(国後島)に2つ存在する
    if (m.name === '泊村') {
      m.pref = tomariCount === 0 ? '後志' : '根室';
      tomariCount++;
    } else if (CITY_TO_BUREAU[m.name]) {
      m.pref = CITY_TO_BUREAU[m.name];
    }
  }
});

const OKI='沖縄県', W=600, H=660, SVGNS='http://www.w3.org/2000/svg';
const $ = id=>document.getElementById(id);
const toFull = s => (s||'').normalize('NFKC');

const REGIONS={
 '北海道':['石狩','渡島','檜山','後志','空知','上川','留萌','宗谷','オホーツク','胆振','日高','十勝','釧路','根室'],
 '東北':['青森県','岩手県','宮城県','秋田県','山形県','福島県'],
 '関東':['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],
 '中部':['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],
 '近畿':['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],
 '中国':['鳥取県','島根県','岡山県','広島県','山口県'],
 '四国':['徳島県','香川県','愛媛県','高知県'],
 '九州':['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'],
};
const PREF2REGION={}; for(const[r,ps]of Object.entries(REGIONS))ps.forEach(p=>PREF2REGION[p]=r);
// ヒントは全問これらの広域ブロック単位で統一（北海道を単独で示さないため、北海道は東北と同じ「北日本」に固定）
const HINT_ZONES={
 '北海道':['石狩','渡島','檜山','後志','空知','上川','留萌','宗谷','オホーツク','胆振','日高','十勝','釧路','根室'],
 '東北':['青森県','岩手県','宮城県','秋田県','山形県','福島県'],
 '関東':['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],
 '中部':['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],
 '近畿':['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],
 '中国四国':['鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県'],
 '九州沖縄':['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'],
};
const HINT_LABEL={'北海道':'北海道','東北':'東北','関東':'関東','中部':'中部','近畿':'近畿','中国四国':'中国・四国','九州沖縄':'九州・沖縄'};
const PREF2HZONE={}; for(const[z,ps]of Object.entries(HINT_ZONES))ps.forEach(p=>PREF2HZONE[p]=z);

// group municipalities by kanji name -> {prefs:[...unique], instances:[{pref,kana}], diffRead:bool}
const byName={};
DATA.munis.forEach(m=>{
  (byName[m.name] ||= {instances:[]}).instances.push({pref:m.pref, kana:toFull(m.kana)});
});
const allNames=[];
for(const [name,o] of Object.entries(byName)){
  o.prefs=[...new Set(o.instances.map(i=>i.pref))];
  o.diffRead = new Set(o.instances.map(i=>i.kana)).size>1;
  allNames.push(name);
}

// ---------- map ----------
function polysOf(f){const g=f.geometry;return g.type==='Polygon'?[g.coordinates]:g.coordinates;}
function bboxOf(fs){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  fs.forEach(f=>polysOf(f).forEach(p=>p.forEach(r=>r.forEach(([x,y])=>{if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}))));
  return{minx:a,miny:b,maxx:c,maxy:d};}
function makeProj(bb,w,h,padx,pady){
  const k=Math.cos((bb.miny+bb.maxy)/2*Math.PI/180);
  const s=Math.min(w/((bb.maxx-bb.minx)*k), h/(bb.maxy-bb.miny));
  const ox=padx+(w-(bb.maxx-bb.minx)*k*s)/2, oy=pady+(h-(bb.maxy-bb.miny)*s)/2;
  return ([lng,lat])=>[(lng-bb.minx)*k*s+ox,(bb.maxy-lat)*s+oy];}
function pathD(f,proj){let d='';polysOf(f).forEach(p=>p.forEach(r=>{
  r.forEach((pt,i)=>{const[x,y]=proj(pt);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});d+='Z';}));return d;}

const mainF=GEO.features.filter(f=>f.properties.nam_ja!==OKI);
const okiF=GEO.features.find(f=>f.properties.nam_ja===OKI);
const mainProj=makeProj(bboxOf(mainF),W-20,H-20,10,10);
const inW=120,inH=120,inX=10,inY=10;
const okiProj=makeProj(bboxOf([okiF]),inW-16,inH-16,inX+8,inY+8);

const svg=document.createElementNS(SVGNS,'svg');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const pathByPref={};
function addPath(f,proj){
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d',pathD(f,proj)); p.setAttribute('class','pref');
  const rawName = f.properties.nam_ja;
  const name = rawName.replace(/総合振興局|振興局/, '');
  p.dataset.pref=name;
  (pathByPref[name] ||= []).push(p);
  p.addEventListener('click',()=>onClick(name));
  p.addEventListener('mousemove',e=>showTip(e,name));
  p.addEventListener('mouseleave',hideTip);
  svg.appendChild(p);
}
mainF.forEach(f=>addPath(f,mainProj));
const box=document.createElementNS(SVGNS,'rect');
box.setAttribute('x',inX);box.setAttribute('y',inY);box.setAttribute('width',inW);box.setAttribute('height',inH);
box.setAttribute('class','insetbox');svg.appendChild(box);
addPath(okiF,okiProj);
const il=document.createElementNS(SVGNS,'text');
il.setAttribute('x',inX+6);il.setAttribute('y',inY+14);il.setAttribute('class','inset-label');il.textContent='沖縄';
svg.appendChild(il);
$('mapwrap').appendChild(svg);

const tip=$('tip'), mapwrap=$('mapwrap');
function showTip(e,name){const r=mapwrap.getBoundingClientRect();
  tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';
  tip.textContent=name;tip.style.opacity=1;}
function hideTip(){tip.style.opacity=0;}
function clearClasses(){Object.values(pathByPref).flat().forEach(p=>p.classList.remove('cand','found','ng'));}

// ---------- quiz state ----------
let pool=[], cur=null, currentTargets=[], found=new Set(), locked=true, hinted=false;
let score=0, total=0, streak=0, best=0;
const missed=new Set();
let reviewMode=false;

function buildPool(){
  const region = $('region').value;
  const mode=$('range').value;
  pool=allNames.filter(n=>{
    // ① 地域フィルタ：選択された地域に属する県が一つでもあれば残す
    if (region !== 'all') {
      const o = byName[n];
      const inRegion = o.prefs.some(p => PREF2HZONE[p] === region);
      if (!inRegion) return false;
    }

    // ② 範囲フィルタ：市・町村の絞り込み
    if (mode === 'shi') return n.endsWith('市');
    if (mode === 'machimura') return n.endsWith('町') || n.endsWith('村');
    return true;
  });
}
function next(){
  clearClasses(); found=new Set(); locked=false; hinted=false;
  const src = reviewMode ? [...missed] : pool;
  if(reviewMode && src.length===0){ exitReview(); return; }
  cur = src[Math.floor(Math.random()*src.length)];
  const o=byName[cur];
  
  // 選択中の地域に合わせてターゲット県を絞り込む
  const region = $('region').value;
  currentTargets = (region === 'all') ? o.prefs : o.prefs.filter(p => PREF2HZONE[p] === region);
  const targetInstances = o.instances.filter(i => currentTargets.includes(i.pref));

  $('muni').textContent=cur;
  $('modeLabel').textContent = reviewMode ? '復習モード' : '';
  
  // ターゲット県が1つだけならフリガナを表示
  $('kana').textContent = currentTargets.length===1 ? targetInstances[0].kana : '';
  $('dupBadge').style.display='none';
  
  const prog=$('progress');
  if(currentTargets.length>1){prog.style.display='';prog.textContent=`0 / ${currentTargets.length}`;}
  else prog.style.display='none';
  
  $('feedback').innerHTML='';
  $('next').disabled=true; $('hint').disabled=false; $('giveup').disabled=false;
}
function onClick(pref){
  if(locked||!cur) return;
  if(found.has(pref)) return;
  // 判定基準を currentTargets に変更
  if(currentTargets.includes(pref)){
    found.add(pref);
    (pathByPref[pref]||[]).forEach(p=>{p.classList.remove('cand');p.classList.add('found');});
    if(currentTargets.length>1) $('progress').textContent=`${found.size} / ${currentTargets.length}`;
    if(found.size===currentTargets.length) resolve('clear');
  } else {
    (pathByPref[pref]||[]).forEach(p=>p.classList.add('ng'));
    resolve('wrong');
  }
}
function resolve(kind){ // 'clear' | 'wrong' | 'giveup'
  locked=true; total++;
  const o=byName[cur];
  
  // ターゲット県だけを正解表示にする
  currentTargets.forEach(pf=>(pathByPref[pf]||[]).forEach(p=>{p.classList.remove('cand');p.classList.add('found');}));
  
  let cls,txt;
  if(kind==='clear' && !hinted){ cls='ok'; txt='正解！'; score++; streak++; best=Math.max(best,streak); missed.delete(cur); }
  else if(kind==='clear' && hinted){ cls='hintdone'; txt='クリア（ヒント使用・カウント外）'; missed.delete(cur); }
  else { cls='ng'; txt = kind==='giveup'?'答え':'不正解'; streak=0; if(!reviewMode||true) missed.add(cur); }

  let html=`<div class="res ${cls}">${txt}</div>`;
  html+=`<div class="reads">`;
  
  // ターゲット県の情報だけを画面に出す
  const targetInstances = o.instances.filter(i => currentTargets.includes(i.pref));
  targetInstances.forEach(ins=>{
    html+=`<div class="rline"><span class="rp">${ins.pref}</span><span class="rk">${ins.kana}</span></div>`;
  });
  html+=`</div>`;
  
  // 対象となった県の中だけで「読み違い」が発生しているか計算
  const diffRead = new Set(targetInstances.map(i => i.kana)).size > 1;
  if(diffRead) html+=`<div class="footnote" style="margin-top:6px">⚠ 同じ漢字でも読みが違います</div>`;
  $('feedback').innerHTML=html;
  if(diffRead){$('dupBadge').style.display='';}
  
  $('hint').disabled=true; $('giveup').disabled=true; $('next').disabled=false;
  updateStats();
}
function doHint(){
  if(locked||!cur||hinted) return;
  hinted=true;
  const o=byName[cur];
  
  // ターゲット県を含むブロックのみを抽出
  const zones=[...new Set(currentTargets.map(p=>PREF2HZONE[p]))];
  const cand=new Set(); zones.forEach(z=>HINT_ZONES[z].forEach(p=>cand.add(p)));
  cand.forEach(p=>{ if(!found.has(p)) (pathByPref[p]||[]).forEach(el=>el.classList.add('cand')); });
  const label=zones.map(z=>HINT_LABEL[z]).join('・');
  
  // よみかたヒントもターゲット県のみに絞る
  const targetInstances = o.instances.filter(i => currentTargets.includes(i.pref));
  const reads=[...new Set(targetInstances.map(i=>i.kana))].join(' / ');
  
  $('feedback').innerHTML=`<div class="res hintdone">ヒント：${label}（${cand.size}県）</div>`+
    `<div class="rline" style="margin-top:6px"><span class="rp">よみ</span><span class="rk">${reads}</span></div>`+
    `<div class="footnote" style="margin-top:4px">※ ヒント使用後は正解にカウントされません</div>`;
}
function updateStats(){
  $('sScore').textContent=score; $('sTotal').textContent=total;
  $('sAcc').textContent = total? Math.round(score/total*100)+'%' : '—';
  $('sStreak').textContent=streak; $('sBest').textContent=best;
  $('review').textContent=`復習 (${missed.size})`;
  $('review').disabled = missed.size===0 || reviewMode;
}
function enterReview(){ if(missed.size===0)return; reviewMode=true;
  $('exitReview').style.display=''; $('review').disabled=true; next(); }
function exitReview(){ reviewMode=false; $('exitReview').style.display='none'; updateStats(); next(); }

$('next').addEventListener('click',next);
$('hint').addEventListener('click',doHint);
$('giveup').addEventListener('click',()=>{ if(!locked) resolve('giveup'); });
$('range').addEventListener('change',()=>{ if(reviewMode)exitReview(); buildPool(); next(); });
$('region').addEventListener('change',()=>{ if(reviewMode)exitReview(); buildPool(); next(); }); // これを追加
$('review').addEventListener('click',enterReview);
$('exitReview').addEventListener('click',exitReview);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ if(!$('next').disabled) next(); }
  else if(e.key==='h'||e.key==='H'){ doHint(); }
});

buildPool(); next();
</script>
